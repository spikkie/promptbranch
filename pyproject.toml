[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbranch"
version = "0.1.126.1.1.1.1.3"
description = "Stateful ChatGPT workflow CLI and reusable browser-automation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "httpx",
  "starlette==0.50.0",
  "patchright==1.58.2",
  "playwright==1.52.0",
  "pydantic",
  "pytest==9.0.2",
  "python-dotenv",
  "python-multipart",
  "uvicorn",
  "watchfiles",
]

[tool.setuptools]
py-modules = ["promptbranch_cli", "promptbranch_container_api", "promptbranch_service_client", "promptbranch_state", "promptbranch_shell_model", "promptbranch_artifacts", "promptbranch_artifact_guardian", "promptbranch_mcp", "promptbranch_ask_protocol", "promptbranch_full_integration_test", "promptbranch_login_test", "promptbranch_cli_sequence_v5", "promptbranch_test_suite", "promptbranch_eta", "promptbranch_test_report", "promptbranch_version", "promptbranch_project", "promptbranch_repos", "promptbranch_parallel", "promptbranch_profiles", "promptbranch_scheduler", "promptbranch_backend_reads", "promptbranch_task_fanout", "promptbranch_parallel_ask", "promptbranch_source_queue", "promptbranch_release_scheduler", "promptbranch_project_delete_safety", "promptbranch_orchestration", "promptbranch_loop", "promptbranch_project_control", "promptbranch_project_authority", "promptbranch_behavioral_surface", "promptbranch_release_engine", "promptbranch_release_pipeline", "promptbranch_release_identity", "promptbranch_release_attempt", "promptbranch_release_state_machine", "promptbranch_release_eta", "promptbranch_source_fingerprint", "promptbranch_release_set", "promptbranch_release_set_rollout", "promptbranch_application_architecture", "promptbranch_application_migration", "promptbranch_skillrun", "promptbranch_operational_evidence", "promptbranch_impact_testing", "promptbranch_mvp_proof"]

[tool.setuptools.packages.find]
include = ["promptbranch*", "promptbranch_automation*", "promptbranch_browser_auth*"]

[project.scripts]
promptbranch = "promptbranch.cli:main"
pb = "promptbranch.cli:main"
promptbranch-ui = "promptbranch_container_api:main"

[tool.setuptools.package-data]
promptbranch = ["completions/*"]
promptbranch_protocol = ["schemas/*.json", "examples/*.json", "prompts/*.md"]
