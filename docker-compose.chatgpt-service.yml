name: chatgpt_claudecode_workflow

services:
  chatgpt-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROMPTBRANCH_VERSION: ${PROMPTBRANCH_VERSION:-unknown}
        PROMPTBRANCH_ARTIFACT_SHA256: ${PROMPTBRANCH_ARTIFACT_SHA256:-unknown}
        PROMPTBRANCH_SOURCE_FINGERPRINT: ${PROMPTBRANCH_SOURCE_FINGERPRINT:-unknown}
    image: ${PROMPTBRANCH_SERVICE_IMAGE:-promptbranch-service:${PROMPTBRANCH_SERVICE_IMAGE_TAG:-local}}
    pull_policy: build
    init: true
    user: "${PROMPTBRANCH_DOCKER_UID:-1000}:${PROMPTBRANCH_DOCKER_GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      HOME: ${PROMPTBRANCH_CONTAINER_HOME:-/tmp/promptbranch-home}
      XDG_CACHE_HOME: ${PROMPTBRANCH_CONTAINER_XDG_CACHE_HOME:-/tmp/promptbranch-cache}
      XDG_CONFIG_HOME: ${PROMPTBRANCH_CONTAINER_XDG_CONFIG_HOME:-/tmp/promptbranch-config}
      PYTHONDONTWRITEBYTECODE: "1"
      CHATGPT_UVICORN_APP: promptbranch_container_api:app
      CHATGPT_UVICORN_RELOAD: ${CHATGPT_UVICORN_RELOAD:-0}
      CHATGPT_PROJECT_URL: ${CHATGPT_PROJECT_URL:-https://chatgpt.com/}
      CHATGPT_EMAIL: ${CHATGPT_EMAIL:-}
      CHATGPT_PASSWORD_FILE: /run/secrets/chatgpt_password
      CHATGPT_HEADLESS: ${CHATGPT_HEADLESS:-0}
      CHATGPT_USE_PATCHRIGHT: ${CHATGPT_USE_PATCHRIGHT:-1}
      CHATGPT_BROWSER_CHANNEL: ${CHATGPT_BROWSER_CHANNEL:-chrome}
      CHATGPT_DISABLE_FEDCM: ${CHATGPT_DISABLE_FEDCM:-1}
      CHATGPT_FILTER_NO_SANDBOX: ${CHATGPT_FILTER_NO_SANDBOX:-0}
      CHATGPT_PATCHRIGHT_HEADED_SAFE_ARGS: ${CHATGPT_PATCHRIGHT_HEADED_SAFE_ARGS:-1}
      CHATGPT_BROWSER_EXTRA_ARGS: ${CHATGPT_BROWSER_EXTRA_ARGS:-}
      CHATGPT_CONVERSATION_HISTORY_REQUEST_SHIELD_MODE: ${CHATGPT_CONVERSATION_HISTORY_REQUEST_SHIELD_MODE:-fulfill_empty}
      CHATGPT_SERVICE_TOKEN: ${CHATGPT_SERVICE_TOKEN:-}
      CHATGPT_RESPONSE_TIMEOUT_MS: ${CHATGPT_RESPONSE_TIMEOUT_MS:-1200000}
      CHATGPT_MAX_RETRIES: ${CHATGPT_MAX_RETRIES:-2}
      CHATGPT_RETRY_BACKOFF_SECONDS: ${CHATGPT_RETRY_BACKOFF_SECONDS:-2.0}
      CHATGPT_MIN_CONTEXT_SPACING_SECONDS: ${CHATGPT_MIN_CONTEXT_SPACING_SECONDS:-8.0}
      CHATGPT_CONVERSATION_HISTORY_RATE_LIMIT_COOLDOWN_SECONDS: ${CHATGPT_CONVERSATION_HISTORY_RATE_LIMIT_COOLDOWN_SECONDS:-120.0}
      CHATGPT_CLEAR_PROFILE_SINGLETON_LOCKS: ${CHATGPT_CLEAR_PROFILE_SINGLETON_LOCKS:-1}
      PROMPTBRANCH_DOCKER_BROWSER_PROFILE: ${PROMPTBRANCH_DOCKER_BROWSER_PROFILE:-promptbranch}
      PROMPTBRANCH_PROFILE_DIR: ${PROMPTBRANCH_PROFILE_DIR:-/app/.pb_profile}
      PROMPTBRANCH_DOCKER_XVFB_SCREEN: ${PROMPTBRANCH_DOCKER_XVFB_SCREEN:-1920x1080x24}
      PROMPTBRANCH_ALLOW_PROJECT_SOURCE_MUTATION: ${PROMPTBRANCH_ALLOW_PROJECT_SOURCE_MUTATION:-0}
      CHATGPT_CHALLENGE_WAIT_TIMEOUT_MS: ${CHATGPT_CHALLENGE_WAIT_TIMEOUT_MS:-20000}
    volumes:
      - ./.pb_profile:/app/.pb_profile
      - ${PROMPTBRANCH_HOST_PROFILE_DIR:-./.pb_profile_docker}:/app/profile
      - ./debug_artifacts:/app/debug_artifacts
    secrets:
      - chatgpt_password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - path: .
          action: sync
          target: /app
          initial_sync: true
          ignore:
            - .git/
            - .pytest_cache/
            - .venv/
            - __pycache__/
            - .pb_profile/
            - .pb_profile_docker/
            - debug_artifacts/
            - uploaded_receipts*
            - '*.log'
            - '*.zip'
            - Dockerfile
            - docker-compose.chatgpt-service.yml
            - requirements.txt
            - pyproject.toml
            - docker/run-chatgpt-service-in-container.sh
        - path: docker/run-chatgpt-service-in-container.sh
          action: sync+restart
          target: /app/docker/run-chatgpt-service-in-container.sh
        - path: Dockerfile
          action: rebuild
        - path: requirements.txt
          action: rebuild
        - path: pyproject.toml
          action: rebuild

secrets:
  chatgpt_password:
    file: ${CHATGPT_PASSWORD_SECRET_FILE:-${HOME}/.config/chatgpt/password.txt}
